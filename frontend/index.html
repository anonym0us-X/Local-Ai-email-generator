<!DOCTYPE html>
<html>
<head>
  <title>Email Writer</title>
  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    input, textarea, select {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }

    #output {
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2>AI Email Writer</h2>

  <input id="purpose" placeholder="Purpose (e.g. Leave request)">

  <select id="tone">
    <option>Formal</option>
    <option>Friendly</option>
    <option>Apology</option>
    <option>Professional</option>
  </select>

  <input id="recipient" placeholder="Recipient (e.g. Manager)">

  <textarea id="details" placeholder="Enter details..."></textarea>

  <button onclick="generateEmail()">Generate Email</button>

  <div id="output"></div>

  <script>
    async function generateEmail() {
  const output = document.getElementById("output");
  output.innerText = "Generating...";

  const data = {
    purpose: document.getElementById("purpose").value,
    tone: document.getElementById("tone").value,
    recipient: document.getElementById("recipient").value,
    details: document.getElementById("details").value
  };

  try {
    const res = await fetch("http://127.0.0.1:8000/generate-email", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    console.log(result); // 👈 IMPORTANT

    if (result.success) {
      output.innerText = result.output;
    } else {
      output.innerText = "Error: " + result.error;
    }

  } catch (err) {
    console.error(err);
    output.innerText = "Failed to connect to backend";
  }
}
  </script>

</body>
</html>
